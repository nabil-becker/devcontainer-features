name: "Lint"
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The checks run inside .devcontainer/ci, the toolchain of this repository's
      # devcontainer (shellcheck, yamllint, PowerShell, Pester and PSScriptAnalyzer
      # at pinned versions, in that file and nowhere else), so CI and a local
      # `task lint` give the same answer. `task lint` is the whole list: shellcheck,
      # yamllint, PSScriptAnalyzer, Pester, the vendored-helper check, the Docker-free
      # unit tests and the toolchain-drift check. Nothing is pushed to a registry.
      - name: "Stage the local Features"
        run: bash .devcontainer/stage-features.sh

      # READMEs are generated from devcontainer-feature.json + NOTES.md and
      # committed by the contributor (`task docs`), so they are reviewed with
      # the change and the release job never has to open a bot PR.
      - name: "task lint and the generated READMEs, in the devcontainer"
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          configFile: .devcontainer/ci/devcontainer.json
          push: never
          runCmd: |
            set -e
            task lint
            task docs:check

      - name: "Feature folders have tests and NOTES.md"
        run: |
          set -e
          for d in src/*/; do
            id=$(basename "$d")
            test -f "test/$id/test.sh" || { echo "missing test/$id/test.sh"; exit 1; }
            test -f "$d/NOTES.md" || { echo "missing $d/NOTES.md"; exit 1; }
          done
