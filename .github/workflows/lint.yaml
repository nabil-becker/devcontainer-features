name: "Lint"
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "shellcheck"
        run: shellcheck -x src/*/*.sh test/*/*.sh bootstrap/*.sh .githooks/*

      - name: "yamllint"
        run: |
          pip install --quiet yamllint
          yamllint --strict .

      - name: "PSScriptAnalyzer"
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          ./.github/scripts/Invoke-PSScriptAnalyzer.ps1

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli

      # READMEs are generated from devcontainer-feature.json + NOTES.md and
      # committed by the contributor (`task docs`), so they are reviewed with
      # the change and the release job never has to open a bot PR.
      - name: "Generated READMEs are up to date"
        run: |
          snapshot() { for f in src/*/README.md; do [ -f "$f" ] && printf '%s ' "$f" && sha256sum < "$f"; done; }
          before="$(snapshot)"
          devcontainer features generate-docs -p src -n nabil-becker/devcontainer-features --github-owner nabil-becker --github-repo devcontainer-features
          after="$(snapshot)"
          if [ "$before" != "$after" ]; then
            echo '::error::src/<id>/README.md is stale or missing - run `task docs` and commit the result'
            git status --short -- 'src/*/README.md'; git diff -- 'src/*/README.md' | head -40
            exit 1
          fi

      - name: "Feature folders have tests and NOTES.md"
        run: |
          set -e
          for d in src/*/; do
            id=$(basename "$d")
            test -f "test/$id/test.sh" || { echo "missing test/$id/test.sh"; exit 1; }
            test -f "$d/NOTES.md" || { echo "missing $d/NOTES.md"; exit 1; }
          done
