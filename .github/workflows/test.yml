name: Test features

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check shell scripts
        run: |
          for script in src/*/install.sh test/*/*.sh; do bash -n "$script"; done
          shellcheck --exclude=SC1091 src/*/install.sh test/*/*.sh
      - name: Validate and package feature metadata
        run: |
          npm install --global @devcontainers/cli@0.89.0
          devcontainer features package ./src --output-folder /tmp/devcontainer-feature-packages
      - name: Validate feature schema
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          validate-only: 'true'
          base-path-to-features: './src'
          devcontainer-cli-version: '0.89.0'

  features:
    name: Feature (${{ matrix.feature }}, ${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        feature: [node, python]
        image: ['debian:12', 'ubuntu:24.04']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global @devcontainers/cli@0.89.0
      - name: Test feature
        env:
          FEATURE: ${{ matrix.feature }}
          BASE_IMAGE: ${{ matrix.image }}
        run: devcontainer features test --project-folder . --features "$FEATURE" --base-image "$BASE_IMAGE"

  combined:
    name: Combined non-root
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global @devcontainers/cli@0.89.0
      - run: devcontainer features test --project-folder . --global-scenarios-only
