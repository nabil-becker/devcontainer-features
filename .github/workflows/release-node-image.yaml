name: "Release the facilitator node image"
# Manual, the Operator starts it, after release-bundle and after the pull request that pins the bundle's
# digests in src/facilitator/digests.txt is merged (ruling AC: the image is built from the released asset by
# digest). Downloads both assets of facilitator-bundle-v<version>, refuses any whose sha256 differs from the pin
# on main, and pushes ghcr.io/<owner>/facilitator-node:<version> for linux/amd64 and linux/arm64 (QEMU runs the
# image's one apt-get step for arm64), with a build attestation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "The released bundle, checked against the pins"
        id: bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          version="$(bash bundles/facilitator/install.sh --version)"
          mkdir ctx
          gh release download "facilitator-bundle-v$version" --pattern SHA256SUMS \
            --pattern "facilitator-$version-linux-*.tar.gz" --dir ctx
          for arch in amd64 arm64; do
            asset="facilitator-$version-linux-$arch.tar.gz"
            pin="$(awk -v n="$asset" '$2 == n { print $1 }' src/facilitator/digests.txt)"
            [ -n "$pin" ] || { echo "$asset is not pinned in src/facilitator/digests.txt"; exit 1; }
            echo "$pin  ctx/$asset" | sha256sum -c -
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ctx
          file: bundles/facilitator/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BUNDLE_VERSION=${{ steps.bundle.outputs.version }}
          tags: ghcr.io/${{ github.repository_owner }}/facilitator-node:${{ steps.bundle.outputs.version }}
          push: true
          provenance: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/facilitator-node
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
