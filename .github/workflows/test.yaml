name: "CI - Test Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-host-taskfile:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install Task (reported regression version)"
        shell: pwsh
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.45.5
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$(go env GOPATH)/bin" >> $env:GITHUB_PATH

      - name: "Test vendored devcontainer Taskfile settings"
        shell: pwsh
        run: ./.github/scripts/Test-DevcontainerTaskfile.ps1

  test-autogenerated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - go-task
          - devcontainer-cli
          - claude-code
          - coder-cli
          - openbao
          - velero
          - kustomize
          - kubeconform
          - argocd
          - dsc
        baseImage:
          - debian:latest
          - ubuntu:latest
          - mcr.microsoft.com/devcontainers/base:debian
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test '${{ matrix.features }}' against '${{ matrix.baseImage }}'"
        # GITHUB_TOKEN reaches Feature builds that query the Releases API
        # (dsc) so the matrix does not exhaust the unauthenticated limit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: devcontainer features test --skip-scenarios -f ${{ matrix.features }} -i ${{ matrix.baseImage }} .

  test-scenarios:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - go-task
          - devcontainer-cli
          - claude-code
          - coder-cli
          - openbao
          - velero
          - kustomize
          - kubeconform
          - argocd
          - dsc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test '${{ matrix.features }}' scenarios"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: devcontainer features test -f ${{ matrix.features }} --skip-autogenerated --skip-duplicated .

  test-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli

      - name: "Test global scenarios"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: devcontainer features test --global-scenarios-only .

  # Single status check for the branch ruleset to require, regardless of how
  # the matrix above evolves.
  tests:
    if: always()
    needs: [test-host-taskfile, test-autogenerated, test-scenarios, test-global]
    runs-on: ubuntu-latest
    steps:
      - name: "Fail if any test job failed"
        run: |
          echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled)"' && exit 1 || echo "all test jobs passed"
