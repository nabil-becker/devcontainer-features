name: "Release dev container features"
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Publishes each src/<id> as ghcr.io/nabil-becker/devcontainer-features/<id>
      # (tags: <major>, <major>.<minor>, <major>.<minor>.<patch>, latest).
      # READMEs are not generated here: contributors commit them via
      # `task docs` and the Lint workflow verifies they are current, so this
      # job needs no write access to the repository.
      - name: "Publish Features"
        uses: devcontainers/action@bef2cf2d1a019b00b45e184f83035e01bd1972f3 # v1.4.4
        with:
          publish-features: "true"
          base-path-to-features: "./src"
          generate-docs: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
