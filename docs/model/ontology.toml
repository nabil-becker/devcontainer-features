[cli-adapter]
type = "mechanism"
term = "CLI adapter"
summary = "An agent-adapter-<cli> executable installed by a CLI Feature that the agents Feature calls to start, wake, open or list that CLI's sessions; chosen by cli:, the only use of the word adapter."

[augmentation]
type = "concept"
term = "Augmentation"
summary = "A Feature with the same id as a tool an official Feature or the base image installs, ordered after it with installsAfter, adding persistent state, a wrapper, a Taskfile or a setup script."

[wrapper]
type = "mechanism"
term = "Wrapper"
summary = "An executable a Feature installs ahead of a tool on PATH under the tool's own name to adjust its behaviour (git, claude)."

[local-workaround]
type = "concept"
term = "Local workaround"
summary = "A consuming repository's own script around a gap in this collection; each one found is a backlog item here."

[launcher]
type = "mechanism"
term = "Launcher"
summary = "The host-side bootstrap and task set (task devcontainer:*) that runs devcontainer up and sets DCF_HOST_*; host side only."

[shared-script]
type = "product"
term = "Shared script"
summary = "A script in src/common vendored verbatim into the Features that use it (dcf-persist, dcf-curl)."

[devcontainer-hook]
type = "mechanism"
term = "Devcontainer hook"
summary = "A postCreateCommand, postStartCommand or postAttachCommand of the Dev Container spec."

[setup-script]
