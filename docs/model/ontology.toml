predicate = "uses"
object = "backlog-id"

[workstream-number]
type = "concept"
term = "Workstream number"
summary = "The <n> in a branch name, always present and counted from 1; a parallel stream on the same item takes the next."

[[relation]]
subject = "branch-rule"
predicate = "uses"
object = "workstream-number"

[done]
type = "concept"
term = "Done"
summary = "A backlog item is done when its pull request is merged to main; releasing is a separate step the Operator starts."

[[relation]]
