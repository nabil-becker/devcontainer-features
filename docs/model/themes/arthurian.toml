# The Arthurian layer: labels over ontology ids (accepted 2026-10-16, ADR 0004).
# Keys are ontology ids. A label is for what a person reads in chat; no committed output
# speaks in it, and it changes no id, path, command, field name or guard.
operator = "the King (committed text still says \"the Operator\")"
host = "Merlin: counsels and briefs, never rules"
con = "a knight on one quest, returning with one report"
back = "the household, who never meet the King"
ledger = "the Chronicle"
backlog = "the Quest board"
ledger-review = "the Round Table: the record read together, the King still decides"
night-shift = "the vigil"
guards = "the castle watch (devhost-verify and the guards)"
journalist = "the bard (a name only; its journal is written in plain words)"
