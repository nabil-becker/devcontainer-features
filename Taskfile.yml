version: '3'

# Host-side settings (DEVCONTAINER_DOCKER_PATH, ...) may live in a .env file -
# see bootstrap/env.example.
dotenv: ['.env', '.devcontainer/.env']

includes:
  devcontainer:
    taskfile: ./bootstrap/devcontainer.yml
    aliases: [dc]   # task dc:up == task devcontainer:up, as in the Taskfile the bootstrap writes
    vars:
      # The fleet (task dc:claude:fleet): one session, the devhost's, pinned in .env.
      SESSIONS: "host|HOST_SESSION|.|"
  # Tasks contributed by the Features installed in this repo's devcontainer
  # (go-task:*, devcontainer-cli:*); absent on the host.
  features:
    taskfile: /usr/local/share/go-task/features.yml
    optional: true
    flatten: true

vars:
  TEST_IMAGE: '{{.IMAGE | default "mcr.microsoft.com/devcontainers/base:debian"}}'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  test:
    desc: 'Run `devcontainer features test` for one Feature (FEATURE=go-task) or all of them. IMAGE overrides the base image for the auto-generated test; SCENARIOS=false skips scenarios.json. Needs a Docker daemon (CI, or Docker Desktop on the workstation). Linux/macOS only (the CLI shells out to chmod/bash on the host).'
    platforms: [linux, darwin]
    vars:
      FEATURE: '{{.FEATURE | default ""}}'
      SCENARIOS: '{{.SCENARIOS | default "true"}}'
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: 'no Docker daemon here; Feature tests run in CI on every PR, or locally with Docker Desktop on the workstation'
    cmds:
      - task: devcontainer:cli
        vars:
          SUBCOMMAND: features
          ARGS: 'test -p "{{.ROOT_DIR}}" -i {{.TEST_IMAGE}} --skip-duplicated{{if .FEATURE}} -f {{.FEATURE}}{{end}}{{if ne .SCENARIOS "true"}} --skip-scenarios{{end}} {{.CLI_ARGS}}'

  test:global:
    desc: 'Run only test/_global scenarios (Features combined). Needs a Docker daemon (CI, or Docker Desktop on the workstation). Linux/macOS only, like test.'
    platforms: [linux, darwin]
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: 'no Docker daemon here; Feature tests run in CI on every PR, or locally with Docker Desktop on the workstation'
    cmds:
      - task: devcontainer:cli
        vars:
          SUBCOMMAND: features
          ARGS: 'test -p "{{.ROOT_DIR}}" --global-scenarios-only'

  docs:
    desc: 'Regenerate src/<id>/README.md from each devcontainer-feature.json + NOTES.md with `devcontainer features generate-docs`. Run after changing either and commit the result; CI (lint) fails when a README is stale.'
    # Relative -p on purpose: the CLI embeds the given path in each README's
    # footer link, so an absolute path would leak the local checkout path.
    dir: '{{.ROOT_DIR}}'
    cmds:
      - task: devcontainer:cli
        vars:
          SUBCOMMAND: features
          ARGS: 'generate-docs -p src -n nabil-becker/devcontainer-features --github-owner nabil-becker --github-repo devcontainer-features'

  docs:check:
    desc: 'Fail if any src/<id>/README.md in the working tree differs from what `task docs` generates (the check CI runs). Compares before/after regeneration, so it works on uncommitted changes too.'
    dir: '{{.ROOT_DIR}}'
    cmds:
      - cmd: |
          snapshot() { for f in src/*/README.md; do [ -f "$f" ] && printf '%s ' "$f" && sha256sum < "$f"; done; }
          before="$(snapshot)"
          task docs >/dev/null
          after="$(snapshot)"
          if [ "$before" != "$after" ]; then
            echo "src/<id>/README.md was stale - regenerated now; review and commit:"; git status --short -- 'src/*/README.md'; exit 1
          fi
          echo "generated READMEs are up to date"

  lint:
    desc: 'shellcheck every shell script, yamllint every YAML file (.yamllint), PSScriptAnalyzer every PowerShell file, the vendored copies of src/common/*.sh (in src/ and local-features/) identical to the canonical ones, every download in a Feature script through dcf_curl (common:curl-check), and the Docker-free unit tests (the dcf_curl retry helper, devhost tooling, the git Feature''s .git-dirs mapping, the ssh-agent Feature''s setup script, the cloud-folder Feature''s status and sync, the agents Feature''s list and verbs, the claude-code Feature''s agent adapter, live-session rule and claude-fleet, the host launcher and its agent task) (CI runs exactly this inside .devcontainer/ci; the tools must be installed - this repo''s devcontainer has them, at the pinned versions).'
    cmds:
      - shellcheck -x src/*/*.sh local-features/*/*.sh local-features/*/share/bin/*.sh local-features/*/share/jobs/*/*.sh test/*/*.sh test/*/unit/*.sh test/bootstrap/*.sh bootstrap/*.sh bootstrap/host/*.sh .githooks/* .devcontainer/*.sh
      - yamllint --strict .
      - task: lint:toolchain
      - pwsh -NoLogo -NoProfile -File '{{.ROOT_DIR}}/.github/scripts/Invoke-PSScriptAnalyzer.ps1'
      - task: common:check
      - task: common:curl-check
      - task: taskfiles:check
      - task: test:common-unit
      - task: test:devhost
      - task: test:git-unit
      - task: test:bootstrap
      - task: test:shutdown
      - task: test:host-type
      - task: test:bootstrap-dir
      - task: test:host-mounts
      - task: test:ssh-key-import
      - task: test:ssh-agent-unit
      - task: test:cloud-folder-unit
      - task: test:agents-unit
      - task: test:claude-unit
      - task: test:claude-fleet-task
      - task: test:agent-task

  test:claude-unit:
    desc: 'Docker-free tests of the claude-code Feature''s claude-host live-session rule (a running session, one with a pid, refuses a second copy; ended sessions never count; CLAUDE_HOST_ALLOW_SECOND; the stale-pin warning and CLAUDE_HOST_UPDATE_PIN; `claude agents --json` unavailable), of the claude-host-pin SessionStart hook (the right .env line, every other byte kept, never fails) of claude-fleet (running by id or by folder, unset variable, start with --bg in the folder, --plan, --no-view, the environment beating .env), the deprecation line of the three, and of agent-adapter-claude (list from `claude agents --json --all`, a session found by name and folder, every action by id, a stopped one woken with --bg --resume <session id>, never -c, never rm, resume refused while running, --extras; the list read past a notice line, a slow first read tried again, a quick error such as a wrapper''s said as it is and not retried, resume on an unreadable list opening Claude Code''s own picker, never a new session; the record of each agent''s session, so a retitled session is still found and never started twice, a /clear and a removed session resolved; session-stop, session-remove, record), and of the additionalDirectories managed-settings drop-in (empty, one, several, a space in a path, ~ expanded, re-run idempotent, a relative path refused); a fake claude on PATH answers `agents --json` and records the other calls; part of lint.'
    cmds:
      - bash test/claude-code/unit/live_session_test.sh
      - bash test/claude-code/unit/adapter_test.sh
      - bash test/claude-code/unit/additional_dirs_test.sh
      - bash test/claude-code/unit/musl_test.sh

  test:agents-unit:
    desc: 'Docker-free tests of the agents Feature''s agents command: the agent list (the YAML subset, required keys, unknown keys warned, errors with file and line), AGENTS_FILE from the task variable, .env, .devcontainer/.env, the environment or the default (a missing file named with its source), each verb per kind (start, --resume, --new and its question, up, list, stop, logs), the no-terminal rule, the fallbacks when the adapter answers exit 3, a listing that fails (state error, nothing started, the hint, never a fresh session), an on-demand agent shown none unless running, reset (a dry run by default, duplicates stopped, --purge, only listed agents and their folders, unlisted sessions untouched, a session mid-turn not stopped, uncommitted changes a warning and with --purge a refusal, --force, refused inside a Claude Code session, --all), the once-per-container-start marker, and the Feature Taskfile; a fake adapter keeps sessions in a file and records every call; part of lint. Needs task for the Taskfile part.'
    cmds:
      - bash test/agents/unit/agents_test.sh

  test:agent-task:
    desc: 'Docker-free test of how `task devcontainer:agent`, `devcontainer:agent:list` and `devcontainer:agent:reset` hand the name, the flags and AGENTS_FILE to the agents command, inside the container and through the exec task from the host (--dry), and that the deprecated devcontainer:claude and devcontainer:claude:fleet still run and print one deprecation line; fake commands record what they get; part of lint.'
    cmds:
      - bash test/bootstrap/agent_task_test.sh

  test:claude-fleet-task:
    desc: 'Docker-free test of how `task devcontainer:claude:fleet` hands SESSIONS (encoded) and its arguments to claude-fleet, inside the container and through the exec task from the host (--dry), and its refusal without SESSIONS; a fake claude-fleet records what it gets; part of lint.'
    cmds:
      - bash test/bootstrap/claude_fleet_task_test.sh

  lint:toolchain:
    desc: 'Fail when .devcontainer/ci/devcontainer.json (what the Lint workflow builds) differs from .devcontainer/devcontainer.json in the base image or any Feature it shares (same reference, same options), or when shellcheck, yamllint or powershell has no pinned version; part of lint. Bump a tool version in both files.'
    cmds:
      - python3 -I '{{.ROOT_DIR}}/.github/scripts/check_toolchain.py'

  test:git-unit:
    desc: 'Docker-free tests of the git Feature''s wrapper, git-setup and .git-dirs mapping, run from src/git against temp folders (never the checkout''s own git dir or global config); part of lint.'
    cmds:
      - bash test/git/unit/git_dirs_test.sh
      - bash test/git/unit/safe_directory_test.sh

  test:shutdown:
    desc: 'Docker-free bash tests of the shutdown-check contract (bootstrap/SHUTDOWN.md): the default resolution snippet from bootstrap/devcontainer.yml against fake task and devhost-shutdown-check commands, the starter bootstrap/shutdown-check.sh in temp git repos, and the bash twin''s stop (127 message, refusal, FORCE, prepshutdown) with a stub engine and CLI; part of lint.'
    cmds:
      - bash test/bootstrap/shutdown_resolution_test.sh

  test:host-type:
    desc: 'Docker-free bash tests of HOST_TYPE resolution in the bash twin (src/devcontainer-cli/devcontainer-cli.sh): explicit id, unknown id, auto and HOST_TYPE_PRIORITY (default and an organisation list), the DCF_HOST_* variables handed to the CLI, DEVCONTAINER_DOCKER_PATH still naming the engine; evidence faked with DCF_HOST_UNAME, DCF_HOST_PROC_VERSION and fake docker and devcontainer commands; part of lint. The PowerShell twin is covered by test:bootstrap.'
    cmds:
      - bash test/bootstrap/host_type_test.sh

  test:host-mounts:
    desc: 'Docker-free bash tests of the host mounts the bash twin (src/devcontainer-cli/devcontainer-cli.sh) adds to `up`: the --mount argument per host type (linux, macos, windows-wsl-docker), the source folder created, a mount skipped when the repository''s devcontainer.json already declares its target (JSONC comments, trailing commas, object form, --config), HOST_MOUNTS=false, none for build/exec/read-configuration, the SSH agent socket mount per host type and SSH_AGENT_MODE=key, the cloud folder (DCF_HOST_CLOUD_FOLDER at the fixed /mnt/cloud-folder-host, a Windows path passed as is, a missing folder skipped and never created), and what `host` lists; a stub devcontainer records its arguments; part of lint. The PowerShell twin is in test:bootstrap.'
    cmds:
      - bash test/bootstrap/host_mounts_test.sh

  test:cloud-folder-unit:
    desc: 'Docker-free tests of the cloud-folder Feature''s cloud-folder-setup. Host mode over a faked mount point (a mount table file, no mount, no privilege): the build-time link from mountPoint to the host mount (made, idempotent, none when they are equal, an empty folder replaced, a folder with content or a file refused), status through the link, no source, mounted and not empty, mounted and empty, not writable (skipped as root), a bare folder that is not mounted, mode host with nothing mounted, the mode this version does not know (mount), a path with a space, a mounted file, --json, the post-start report never failing, nothing written into the folder. The installer''s version line under pipefail (a fake rclone writing 100000 lines, no SIGPIPE); its download retries are dcf_curl''s (test:common-unit). Sync mode with a fake rclone that plays bisync between two temp folders: login (a pasted token read from stdin, the drive lookup through rclone''s non-interactive config, several drives, client credentials from a secret file), the first sync a --resync with --max-lock, --max-delete 50, --resilient and --recover, later syncs, a new folder resynced, failures and the delete guard, one sync at a time, the shutdown check (a running sync, pending changes, waiting), the timer (started once, syncing, syncInterval 0, stopped cleanly, a running sync stopped gracefully), and no token in any process''s arguments, log, record or output. Both: the Feature Taskfile handing CLOUD_FOLDER_*, CLI_ARGS and WAIT to the script; part of lint. Needs python3 (to read the JSON) and task.'
    cmds:
      - bash test/cloud-folder/unit/status_test.sh
      - bash test/cloud-folder/unit/sync_test.sh
      - bash test/cloud-folder/unit/version_test.sh

  test:ssh-agent-unit:
    desc: 'Docker-free tests of the ssh-agent Feature''s ssh-agent-setup against temp folders with the real OpenSSH tools and git: the verdict per DCF_HOST_SSH_AGENT (socket, none, key, unknown), key mode (an agent started on the fixed path and reused, a stale socket replaced, a 0600 key loaded and a 0644 one refused, key-new, key-add, key-stdin, key-remove), key hygiene (dedicated default name, default-name and age warnings, key-age), rotation and retirement against a stubbed gh (the steps in order, the old key retired only after git:verify passes, the allowed_signers history, REVOKE, the resume path, --plan changing nothing), the refusal when key mode is off, git-signing (KEY by fingerprint or .pub, SCOPE and its default) and a real sign and verify round trip in git-verify; only throwaway keys; part of lint. Needs openssh-client and git.'
    cmds:
      - bash test/ssh-agent/unit/setup_test.sh

  test:ssh-key-import:
    desc: 'Docker-free bash tests of the host task devcontainer:ssh-key-import in the bash twin (src/devcontainer-cli/devcontainer-cli.sh): the key file reaches `devcontainer exec` on stdin and never in an argument, the .pub follows, the key load runs last, the refusals (no file, no running container, key mode off in the container), and the host-side warnings (default name, a public key also in authorized_keys or another ~/.ssh/*.pub, never printing the key); stub devcontainer and docker record what they get; part of lint. The PowerShell twin is in test:bootstrap.'
    cmds:
      - bash test/bootstrap/ssh_key_import_test.sh

  test:bootstrap-dir:
    desc: 'Docker-free, offline bash tests of where bootstrap/bootstrap.sh vendors: the default .devcontainer/cli_bootstrap.ignore, BOOTSTRAP_DIR and its rejections (absolute, ..), the .gitignore created, appended once, other lines kept, BOOTSTRAP_GITIGNORE=false, the Taskfile template''s optional include of the chosen path, and the old ./bootstrap form (kept, migration note, include repointed, optional: true added when absent); against a temp repo with this checkout as --source and a fake task; part of lint. The PowerShell twin is in test:bootstrap.'
    cmds:
      - bash test/bootstrap/bootstrap_dir_test.sh

  test:bootstrap:
    desc: 'Pester tests of the Windows host launcher (bootstrap/host/DevcontainerCli.psm1) and of bootstrap/bootstrap.ps1 (vendoring folder, BOOTSTRAP_DIR, git-ignore, Taskfile template, old form): the build lock that serialises devcontainer up/build across repositories, the stop check, and HOST_TYPE resolution and the DCF_HOST_* variables (evidence mocked). Needs pwsh with Pester 5 or later (Install-Module Pester -Scope CurrentUser); runs on any host, so it is part of lint.'
    cmds:
      - pwsh -NoLogo -NoProfile -Command "Import-Module Pester -MinimumVersion 5.0; Invoke-Pester -Path '{{.ROOT_DIR}}/test/bootstrap' -Output Detailed -CI"

  test:devhost:
    desc: 'Unit tests of the devhost Feature''s (local-features/devhost) Python tooling (session cost, guards, verify, adr, init, briefing), stdlib only, against temp repos; runs on any host with python3 and git, so it is part of lint.'
    cmds:
      - cmd: python -m unittest discover -s test/devhost/python -q
        platforms: [windows]
      - cmd: python3 -m unittest discover -s test/devhost/python -q
        platforms: [linux, darwin]

  test:devhost:docker:
    desc: 'Run the devhost Feature''s Docker tests (test/devhost: defaults and the non_root scenario) for local-features/devhost, which is not under src/ and so is outside `task test`, CI and the global scenarios. Copies it and its tests into a temporary project folder shaped like a collection (src/devhost, test/devhost) and runs `devcontainer features test` there. IMAGE overrides the base image. Needs a Docker daemon and the devcontainer CLI. Linux/macOS only.'
    platforms: [linux, darwin]
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: 'no Docker daemon here; the devhost Docker tests run only where Docker does'
    cmds:
      - cmd: |
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/src" "$tmp/test"
          cp -r local-features/devhost "$tmp/src/devhost"
          cp -r test/devhost "$tmp/test/devhost"
          devcontainer features test -p "$tmp" -i {{.TEST_IMAGE}} -f devhost {{.CLI_ARGS}}

  features:stage:
    desc: 'Copy every src/<id> Feature and every local-features/<id> Feature (used here, never published) into .devcontainer/features/<id> (gitignored), so this repo''s own devcontainer references the unpublished Features by local path. The devcontainer runs it as initializeCommand before every start.'
    silent: true
    cmds:
      - cmd: pwsh -NoLogo -NoProfile -File .devcontainer/stage-features.ps1
        platforms: [windows]
      - cmd: bash .devcontainer/stage-features.sh
        platforms: [linux, darwin]

  common:check:
    desc: 'Fail if a Feature''s copy of a src/common helper (dcf-persist.sh, dcf-curl.sh) differs from the canonical file. Run `task common:sync` to refresh the copies.'
    silent: true
    cmds:
      - cmd: |
          rc=0
          for canon in src/common/*.sh; do
            name="$(basename "$canon")"
            [ "$name" = install.sh ] && continue
            for copy in src/*/"$name" local-features/*/"$name"; do
              [ "$copy" = "$canon" ] && continue
              [ -e "$copy" ] || continue
              if ! cmp -s "$canon" "$copy"; then echo "stale copy: $copy differs from $canon (task common:sync)"; rc=1; fi
            done
          done
          [ "$rc" -eq 0 ] && echo "common helper copies are up to date"
          exit "$rc"

  common:curl-check:
    desc: 'Fail on a download in a Feature script (src/<id>/*.sh, local-features/<id>/*.sh) that does not go through dcf_curl, the retry helper in src/common/dcf-curl.sh (a curl or wget call: the name followed by an option, a quote, a variable or a URL; comment lines skipped), and on a script that calls dcf_curl without its vendored copy beside it or without sourcing it. A justified exception carries `dcf-curl: allow <reason>` on the same line.'
    silent: true
    cmds:
      - cmd: |
          rc=0
          for f in src/*/*.sh local-features/*/*.sh; do
            [ "$(basename "$f")" = dcf-curl.sh ] && continue
            dir="$(dirname "$f")"
            hits="$(grep -nE '(^|[^[:alnum:]_./-])(curl|wget)[[:space:]]+(-|"|\$|https?:)' "$f" | grep -vE '^[0-9]+:[[:space:]]*#' | grep -v 'dcf-curl: allow' || true)"
            if [ -n "$hits" ]; then
              printf '%s\n' "$hits" | while IFS= read -r h; do echo "$f:$h"; echo "  ^ a download without dcf_curl: source dcf-curl.sh and call dcf_curl, or mark the line 'dcf-curl: allow <reason>'"; done
              rc=1
            fi
            if grep -qE '(^|[^[:alnum:]_])dcf_curl[[:space:]]' "$f"; then
              if [ ! -f "$dir/dcf-curl.sh" ]; then echo "$f calls dcf_curl but $dir/dcf-curl.sh is missing (cp src/common/dcf-curl.sh $dir/)"; rc=1; fi
              if ! grep -qE '^[[:space:]]*(\.|source)[[:space:]].*dcf-curl\.sh' "$f"; then echo "$f calls dcf_curl but never sources dcf-curl.sh"; rc=1; fi
            fi
          done
          [ "$rc" -eq 0 ] && echo "every download in a Feature script goes through dcf_curl"
          exit "$rc"

  test:common-unit:
    desc: 'Docker-free test of the download helper src/common/dcf-curl.sh: the retry flags (--retry-all-errors when curl has it, read without SIGPIPE; dropped on an older curl), the arguments passed through, curl --help read once; then the real curl against a local server that cuts the first connection mid-transfer (curl exit 56) and mid-TLS-handshake (exit 35, needs openssl): plain curl --retry gives up, dcf_curl gets the file; part of lint. Needs python3.'
    cmds:
      - bash test/common/unit/dcf_curl_test.sh

  taskfiles:check:
    desc: 'Fail if a Feature Taskfile (src/<id>/taskfile.yml or local-features/<id>/taskfile.yml) breaks the mechanical rules: every task runs in the directory task was started from (dir: ''{{"{{"}}.USER_WORKING_DIR{{"}}"}}''; included through features.yml it would otherwise run in /usr/local/share/go-task/includes.d), every task has a desc, and the first task is version (NFR-2).'
    silent: true
    cmds:
      - cmd: |
          rc=0
          for f in src/*/taskfile.yml local-features/*/taskfile.yml; do
            found="$(awk -v q="'" '
              function flush() {
                if (task != "" && !dir) print "dir " task
                if (task != "" && !desc) print "desc " task
                task = ""; dir = 0; desc = 0
              }
              /^tasks:$/ { in_tasks = 1; next }
              in_tasks && /^  [A-Za-z0-9:_-]+:$/ {
                flush(); task = $1; sub(/:$/, "", task)
                if (!first) { first = task; if (task != "version") print "first " task }
                next
              }
              in_tasks && $0 == "    dir: " q "{{"{{"}}.USER_WORKING_DIR{{"}}"}}" q { dir = 1 }
              in_tasks && /^    desc: / { desc = 1 }
              END { flush() }' "$f")"
            while read -r kind t; do
              case "$kind" in
                dir) echo "$f: task $t has no dir: '{{"{{"}}.USER_WORKING_DIR{{"}}"}}'" ;;
                desc) echo "$f: task $t has no desc (NFR-2)" ;;
                first) echo "$f: the first task is $t, not version (NFR-2)" ;;
                *) continue ;;
              esac
              rc=1
            done <<EOF
          $found
          EOF
          done
          [ "$rc" -eq 0 ] && echo "every Feature task runs in the caller's directory, has a desc, and version comes first"
          exit "$rc"

  common:sync:
    desc: 'Copy every src/common/*.sh helper over the copies the other Features carry (a Feature folder must be self-contained when published, so the helper is vendored rather than depended on).'
    silent: true
    cmds:
      - cmd: |
          for canon in src/common/*.sh; do
            name="$(basename "$canon")"
            [ "$name" = install.sh ] && continue
            for copy in src/*/"$name" local-features/*/"$name"; do
              [ "$copy" = "$canon" ] && continue
              [ -e "$copy" ] || continue
              cp "$canon" "$copy" && echo "synced $copy"
            done
          done

  repo:setup:
    desc: 'Once per clone: activate the tracked .gitconfig (git config --local include.path ../.gitconfig), which turns on the repo hooks in .githooks/ (auto DCO sign-off) and the `git cs` alias. Touches only this clone''s .git/config, never your global config. Idempotent.'
    silent: true
    cmds:
      - cmd: |
          if [ "$(git config --local --get-all include.path | grep -cx '../.gitconfig')" = "0" ]; then
            git config --local --add include.path ../.gitconfig && echo 'Activated .gitconfig (hooks + alias) for this clone.'
          else
            echo '.gitconfig already active for this clone.'
          fi
      - git config --get core.hooksPath

  repo:govern:
    desc: 'Apply the GitHub governance settings (security features, squash-only merges, Actions allowlist, release environment, protect-main ruleset) with gh - see .github/scripts/Set-RepoGovernance.ps1. Idempotent; needs gh logged in as a repo admin.'
    cmds:
      - pwsh -NoLogo -NoProfile -File '{{.ROOT_DIR}}/.github/scripts/Set-RepoGovernance.ps1'
