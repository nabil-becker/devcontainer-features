# Keycloak 26.8.2 (the version and digest oauth_local.sh pins), dev mode, the realm imported from the ConfigMap. KC_HOSTNAME makes
# the issuer http://localhost:8080/realms/facilitator-test whatever address is dialled. The admin password is a Secret made by
# oauth_local_k8s.sh (kubectl create secret), never in this repository; the test user's password is set after the start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: keycloak}
  template:
    metadata:
      labels: {app.kubernetes.io/name: keycloak}
    spec:
      automountServiceAccountToken: false
      securityContext:                    # the namespace enforces the restricted Pod Security profile
        runAsNonRoot: true
        runAsUser: 1000                   # the image's keycloak user
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
          args: [start-dev, --import-realm]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-admin, key: password}}
            - {name: KC_HOSTNAME, value: "http://localhost:8080"}
            - {name: KC_HTTP_ENABLED, value: "true"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /realms/facilitator-test/.well-known/openid-configuration, port: http}
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: {cpu: 200m, memory: 768Mi}
            limits: {memory: 1536Mi}
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
      volumes:
        - name: realm
          configMap: {name: keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  type: LoadBalancer
  selector: {app.kubernetes.io/name: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: http, protocol: TCP}
