# Tasks contributed by the facilitator Feature (namespace: facilitator). Each runs the facilitator
# command; extra arguments after --, for example:
#   task facilitator:transcript -- --conv c-1a2b3c4d
# A person talks to the agents from their own Claude Code or Copilot session, over the MCP server
# (task facilitator:snippet -- you); these tasks only read, or manage the infrastructure.
version: '3'

tasks:
  version:
    desc: 'Show what is installed: the facilitator, dirctl, slimctl, slim-bindings, register-engine and sign-packet versions, Python and the backend.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator version {{.CLI_ARGS}}']

  check:
    desc: 'One line per part (Python, OpenSSH, the state folder, the record, the binaries, OpenBao, the Directory, SLIM and the ssh-agent with any port''s owner, each participant registered and last seen); exit non-zero when not ready. No secret is printed. -- --json for machines.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator check {{.CLI_ARGS}}']

  setup:
    desc: 'Re-run the post-create setup: the state folder in the volume and the facilitator''s own key (idempotent, never fatal).'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator-setup']

  infra:
    desc: 'The infrastructure the Feature owns, on loopback: -- up | down | status | logs [agent|dir|slim]. up is idempotent; nothing is restarted on a crash (status says so). Participants are never started.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator infra {{.CLI_ARGS | default "status"}}']

  participants:
    desc: 'The participant list (.devcontainer/participants.yml, alias agents.yml) and the humans of facilitator.yml, and who is registered.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator participants {{.CLI_ARGS}}']

  register:
    desc: 'Register participants and people: -- <handle>... | --all. Makes each one''s key (OpenBao, or the 0.1.0 fallback file) and token, and each participant''s OASF record in the Directory.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator register {{.CLI_ARGS}}']

  status:
    desc: 'Who is attached (last receive) and each conversation''s messages, hops, budget and pause (read only).'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator status {{.CLI_ARGS}}']

  mail:
    desc: 'A person''s unread messages, read only (the MCP tool mail of their session marks them read): -- --as <handle> [--json]; -- --notice prints one line or nothing, as the turn hook does. The handle may come from FACILITATOR_HANDLE.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator mail {{.CLI_ARGS}}']

  transcript:
    desc: 'A conversation, read only: -- --conv <id> [--limit <n>] [--json] (every message with its routes, task states and notices).'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator transcript {{.CLI_ARGS}}']

  verify:
    desc: 'Walk a conversation''s messages back to the human who began each chain, checking every signature and link: -- --conv <id> [--message <id>] [--format json]. Exit 0 a good chain, 1 a break, 2 bad usage.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator verify {{.CLI_ARGS}}']

  snippet:
    desc: 'How to attach a participant''s or a person''s CLI: -- <handle>. Prints the one shared MCP entry (for Claude Code, its claude mcp add command; no handle in it), the FACILITATOR_HANDLE and FACILITATOR_TOKEN lines for the environment, the persona sentence, and for a person the Claude Code turn hook. The Feature never edits a CLI''s config.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator snippet {{.CLI_ARGS}}']
