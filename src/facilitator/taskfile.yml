# Tasks contributed by the facilitator Feature (namespace: facilitator). Each runs the facilitator
# command; extra arguments after --, for example:
#   task facilitator:transcript -- --conv c-1a2b3c4d
# A person talks to the agents from their own Claude Code or Copilot session, over the MCP server
# (task facilitator:snippet -- you); these tasks only read, or manage the infrastructure.
version: '3'

tasks:
  version:
    desc: 'Show what is installed: the facilitator, dirctl, slimctl, slim-bindings, register-engine and sign-packet versions, Python and the backend.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator version {{.CLI_ARGS}}']

  check:
    desc: 'One line per part (Python, OpenSSH, the state folder, the record, the binaries, OpenBao, the mesh: mesh.yml, the role, the certificate, what is open beyond loopback, the hub, TLS refusals from the SLIM log and lock two''s refusals; the Directory, SLIM, the peers part and the ssh-agent with any port''s owner, each participant registered and last seen); exit non-zero when not ready. No secret is printed. -- --json for machines. -- <mesh.yml>... (or -) lints mesh files instead: path:line: rule: message, --format json, exit 0 clean, 1 findings, 2 usage.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator check {{.CLI_ARGS}}']

  explain:
    desc: 'The level a SPIFFE ID or a handle gets on this node, what it may reach, and the effective limits of each level with where each value came from (the preset, a Feature option, mesh.yml): -- <spiffe id or handle> [--json]. Read only.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator explain {{.CLI_ARGS}}']

  node-invite:
    desc: 'On a hub or a peer: print a join (or pairing) token for its domain (single use, valid 15 minutes; the join endpoint is open while one is live); -- --level public opens a 15 minute request window for the public domain and prints the info a public node needs. A person''s act: refused inside an agent''s job. Hand the token to the person setting up the spoke.'
    interactive: true
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator node invite']

  node-join:
    desc: 'On a spoke: join a hub with a token from node-invite: -- --token <token or a file holding it> [<hub join address>]. Gets the spoke''s certificate from the hub''s issuer, checks the hub''s trust bundle against the token, writes the hub into mesh.yml (role spoke); then restart the container or run infra up.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator node join {{.CLI_ARGS}}']

  node-revoke:
    desc: 'On a hub or a peer: revoke a node: -- <node>. Its certificate is not renewed and lock two refuses it at once and, from a hub, at the next roster on every spoke; the mesh''s SLIM secret rotates and is handed to the nodes that remain; what it already holds is not recalled. Asks to confirm; refused inside an agent''s job.'
    interactive: true
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator node revoke {{.CLI_ARGS}}']

  node-issuer:
    desc: 'On a hub: the issuer''s tier and its CA: -- status (read only: the tier, the CA''s expiry, for an ssh-agent whether it answers and holds the key), -- export-root --out <a new file> (the built-in root CA''s key and certificate written to a new file, mode 600, and the root key removed from the volume: take the file offline; the hub keeps issuing and no spoke changes anything), -- migrate [--openbao <url>] [--mount <m>] [--token-file <file>] (the built-in CA imported into an OpenBao PKI, the same CA, so no spoke joins again; the token is yours and may configure the mount). export-root and migrate are a person''s acts: refused inside an agent''s job.'
    interactive: true
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator node issuer {{.CLI_ARGS}}']

  node-approve:
    desc: 'On a node that issues a public domain: approve a public node''s join request: -- <request id> [--yes]. The key is approved for the public domain, a certificate of the public level''s svid_ttl (1 h) is issued, and the approval is a signed entry of the audit register. A person''s act: refused inside an agent''s job.'
    interactive: true
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator node approve {{.CLI_ARGS}}']

  node-deny:
    desc: 'Deny a public node''s join request: -- <request id>. A person''s act: refused inside an agent''s job.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator node deny {{.CLI_ARGS}}']

  node-requests:
    desc: 'List the public join requests waiting for a person (each with its key''s fingerprint), approved or denied. Read only.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator node requests']

  node-peer:
    desc: 'On a peer: pair with another peer with its token (node-invite on that peer): -- --token <token or file> [<its join address>]. The two exchange the CA bundles of their own domains, this one adopts the mesh secret, mesh.yml gets the trust and peers entries; then restart SLIM.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator node peer {{.CLI_ARGS}}']

  node-request:
    desc: 'On a public node: ask a node to let this one join its public domain: -- <the info file that `node invite --level public` printed over there>. Sends a key; nothing is issued until a person approves; then run node-collect.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator node request {{.CLI_ARGS}}']

  node-collect:
    desc: 'On a public node: collect the answer to its join request; when a person approved it, install the certificate (1 h), the bundle and the mesh secret, and write mesh.yml (a spoke of the public domain).'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator node collect']

  node-secret:
    desc: 'The mesh''s SLIM app secret, for a node that missed a rotation (prints it; or -- --file <file> sets it). A person carries it over a channel of their own. Refused inside an agent''s job.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator node secret {{.CLI_ARGS}}']

  audit:
    desc: 'The signed audit register of enrolments (HTTP clients and nodes): -- verify (the chain whole, the http log fully replayed), replay (put the lines of http/audit.jsonl in it), show.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator audit {{.CLI_ARGS}}']

  node-status:
    desc: 'The mesh as this node sees it: its role and domain, the peers part''s state, the cards it admitted, a hub''s roster, the last refusals (JSON, read only).'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator node status']

  approve:
    desc: 'A person approves what waits (gate A: limits.<level>.approval every-message or per-conversation): -- <message id | conversation id> [--as <person>] (ids from the mail task), or a client or another node''s agent at first contact. The held message is delivered; the answer is a signed notice in the conversation and an audit entry. A person''s act: refused inside an agent''s job.'
    interactive: true
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator approve {{.CLI_ARGS}}']

  deny:
    desc: 'A person denies what waits (gate A): -- <message id | conversation id> [--as <person>] (ids from the mail task). It is not delivered; the sender''s node gets a signed notice in the conversation; an audit entry records it. A person''s act: refused inside an agent''s job.'
    interactive: true
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator deny {{.CLI_ARGS}}']

  http-token:
    desc: 'Make a bearer token for an HTTP client of this node (slice N4): -- <client> [--label <note>] [--as <person>]. Prints the token once (only its SHA-256 is kept) and how to add it to Claude Code and Copilot CLI. A person''s act: refused inside an agent''s job. Needs facilitator.http.listen in facilitator.yml and a preset above solo in mesh.yml.'
    interactive: true
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator http token {{.CLI_ARGS}}']

  http-forget:
    desc: 'Let a revoked or denied HTTP client back as new (ruling OA3): -- <client> [--as <person>]. Drops its entry, so its OAuth login (issuer and subject) enrols again on its next valid token and is held for a person''s approval, or a bearer client name can be given a new token; written to the audit register; past records keep naming it. A live client is refused (revoke it first). A person''s act: refused inside an agent''s job.'
    interactive: true
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator http forget {{.CLI_ARGS}}']

  http:
    desc: 'The HTTP clients of this node: -- list (the default; no secret shown) | audit (the hash chain of enrolments, approvals, denials and revocations) | issuers (the OAuth authorization servers of http.issuers and whether their keys can be read now) | approve <client> (first contact: its held messages are delivered; a cloud AI''s client is its OAuth issuer and subject) | deny <client> | revoke <client> (its token or OAuth login stops working at once). approve, deny and revoke are a person''s acts, refused inside an agent''s job.'
    interactive: true
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator http {{.CLI_ARGS | default "list"}}']

  setup:
    desc: 'Re-run the post-create setup: the state folder in the volume and the facilitator''s own key (idempotent, never fatal).'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator-setup']

  infra:
    desc: 'The infrastructure the Feature owns: -- up | down | status | logs [agent|dir|slim|peers|http]. On loopback, unless mesh.yml makes the node a hub (a SLIM listener per level) or a joined spoke (a link to its hub, and the peers part). up is idempotent; nothing is restarted on a crash (status says so). Participants are never started.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator infra {{.CLI_ARGS | default "status"}}']

  participants:
    desc: 'The participant list (.devcontainer/participants.yml, alias agents.yml) and the humans of facilitator.yml, and who is registered.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator participants {{.CLI_ARGS}}']

  register:
    desc: 'Register participants and people: -- <handle>... | --all. Makes each one''s key (OpenBao, or the 0.1.0 fallback file) and token, and each participant''s OASF record in the Directory.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator register {{.CLI_ARGS}}']

  status:
    desc: 'Who is attached (last receive) and each conversation''s messages, hops, budget and pause (read only).'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator status {{.CLI_ARGS}}']

  mail:
    desc: 'A person''s unread messages, read only (the MCP tool mail of their session marks them read): -- --as <handle> [--json]; -- --notice prints one line or nothing, as the turn hook does. The handle may come from FACILITATOR_HANDLE.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator mail {{.CLI_ARGS}}']

  transcript:
    desc: 'A conversation, read only: -- --conv <id> [--limit <n>] [--json] (every message with its routes, task states and notices).'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator transcript {{.CLI_ARGS}}']

  verify:
    desc: 'Walk a conversation''s messages back to the human who began each chain, checking every signature and link: -- --conv <id> [--message <id>] [--format json]. Exit 0 a good chain, 1 a break, 2 bad usage.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator verify {{.CLI_ARGS}}']

  snippet:
    desc: 'How to attach a participant''s or a person''s CLI: -- <handle>. Prints the one shared MCP entry (for Claude Code, its claude mcp add command; no handle in it), the FACILITATOR_HANDLE and FACILITATOR_TOKEN lines for the environment, the persona sentence, and for a person the Claude Code turn hook. The Feature never edits a CLI''s config.'
    dir: '{{.USER_WORKING_DIR}}'
    cmds: ['facilitator snippet {{.CLI_ARGS}}']
