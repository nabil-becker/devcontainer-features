# Tasks contributed by the component-registry Feature (namespace: component-registry).
# COMPONENT_REGISTRY_WHOAMI (who you are, a path) and COMPONENT_REGISTRY_FILE (the layer list,
# repository-relative) from the command line, a .env file or the environment; dcf-registry
# resolves the order.
version: '3'

tasks:
  version:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Show the Feature version, which layer list is used (the path and where COMPONENT_REGISTRY_FILE came from), who you are (COMPONENT_REGISTRY_WHOAMI and its source) and the resolved view (for whom, when).'
    cmds:
      - '{{if .COMPONENT_REGISTRY_FILE}}COMPONENT_REGISTRY_FILE_TASK_VAR={{shellQuote .COMPONENT_REGISTRY_FILE}} {{end}}{{if .COMPONENT_REGISTRY_WHOAMI}}COMPONENT_REGISTRY_WHOAMI_TASK_VAR={{shellQuote .COMPONENT_REGISTRY_WHOAMI}} {{end}}dcf-registry version'

  resolve:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Fetch each layer of the layer list (.devcontainer/registry.yml, or COMPONENT_REGISTRY_FILE; an unchanged layer is skipped, an unreachable one uses its last good copy and says so), merge them by value type for who you are (COMPONENT_REGISTRY_WHOAMI, or -- --as <path>), and swap the resolved view in; skipped lines are reported. Fails only for a required layer never fetched or no who-you-are path. Idempotent.'
    cmds:
      - '{{if .COMPONENT_REGISTRY_FILE}}COMPONENT_REGISTRY_FILE_TASK_VAR={{shellQuote .COMPONENT_REGISTRY_FILE}} {{end}}{{if .COMPONENT_REGISTRY_WHOAMI}}COMPONENT_REGISTRY_WHOAMI_TASK_VAR={{shellQuote .COMPONENT_REGISTRY_WHOAMI}} {{end}}dcf-registry resolve {{.CLI_ARGS}}'

  explain:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Read-only: task component-registry:explain -- skills/<name>[:key] shows every line of the resolved component with the layer it came from and the version that layer was read at, the lines skipped and why, and refs that point at nothing; -- <path> --uses lists what refers to the path; -- <path> --color auto|always|never paints each line by its layer.'
    cmds:
      - 'dcf-registry explain {{.CLI_ARGS}}'

  render:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Read-only for the view: task component-registry:render -- <vendor> <folder> [--as <path>] renders that vendor''s winning templates (ADR-0077; the built-in base layer''s, or a layer''s that replaces, extends or adds one) from the resolved view into a new folder: what a hand-over to that CLI gets. Preview a template there; explain -- templates/<vendor> says whose template won.'
    cmds:
      - '{{if .COMPONENT_REGISTRY_WHOAMI}}COMPONENT_REGISTRY_WHOAMI_TASK_VAR={{shellQuote .COMPONENT_REGISTRY_WHOAMI}} {{end}}dcf-registry render {{.CLI_ARGS}}'

  setup:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Re-run the start hook: make the state folder (COMPONENT_REGISTRY_STATE_DIR) usable by the current user and owner-only, and say whether a resolved view is there (idempotent).'
    cmds:
      - component-registry-setup

  refresh:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Resolve now and hand the resolved skills over again (agent-adapter-<cli> skills): every recorded hand-over, each agent for its own path (each path resolved once); -- --session <id> the agent whose session that is, alone; -- --as <path> that path to every CLI adapter on PATH; with no record, the path the latest view was resolved for. Claude Code picks them up in running sessions, a CLI that cannot take them is named. What /registry-refresh runs (with the session id).'
    cmds:
      - '{{if .COMPONENT_REGISTRY_FILE}}COMPONENT_REGISTRY_FILE_TASK_VAR={{shellQuote .COMPONENT_REGISTRY_FILE}} {{end}}{{if .COMPONENT_REGISTRY_WHOAMI}}COMPONENT_REGISTRY_WHOAMI_TASK_VAR={{shellQuote .COMPONENT_REGISTRY_WHOAMI}} {{end}}dcf-registry refresh {{.CLI_ARGS}}'
