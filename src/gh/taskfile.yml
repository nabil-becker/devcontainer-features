# Tasks contributed by the gh Feature (namespace: gh).
version: '3'

tasks:
  version:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Show which gh binary runs and its version (updates come from rebuilding).'
    cmds:
      - command -v gh
      - gh --version

  status:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Show the GitHub login state (gh auth status): accounts, hosts, token scopes.'
    cmds:
      - gh auth status {{.CLI_ARGS}}

  login:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Log in to GitHub interactively (gh auth login); the token is kept in GH_CONFIG_DIR and survives rebuilds. Extra arguments after --, e.g. task gh:login -- --hostname ghe.example.com.'
    interactive: true
    cmds:
      - gh auth login {{.CLI_ARGS}}

  setup:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Re-run the post-create setup: make GH_CONFIG_DIR usable by the current user, configure the git credential helper for github.com, report the login state (idempotent; GH_SETUP_GIT_CREDENTIAL_HELPER overrides the Feature option).'
    cmds:
      - gh-setup

  ssh-key:add:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Register a public key at GitHub as a SIGNING key (gh ssh-key add --type signing), never an authentication key: FILE=<.pub path>, or KEY=ssh/<name> to read its public key from OpenBao (the openbao Feature''s dcf-secret), or the public key on stdin; TITLE= (default the record''s name or the key''s comment). A key already registered as a signing key is left alone (exit 0); a private key is refused. Needs gh logged in with the admin:ssh_signing_key scope (gh auth refresh -s admin:ssh_signing_key). ssh-agent''s key:rotate uses it.'
    vars:
      FILE: '{{.FILE | default ""}}'
      KEY: '{{.KEY | default ""}}'
      TITLE: '{{.TITLE | default ""}}'
    cmds:
      - gh-ssh-key-add --file '{{.FILE}}' --key '{{.KEY}}' --title '{{.TITLE}}'
