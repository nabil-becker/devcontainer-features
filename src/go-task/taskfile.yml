# Tasks contributed by the go-task Feature (namespace: go-task).
version: '3'

tasks:
  version:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Show which task binary runs and its version (updates come from rebuilding; the version option pins it).'
    cmds:
      - command -v task
      - task --version

  registered:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'List the Feature Taskfiles registered under /usr/local/share/go-task/includes.d - what the "features" include of your root Taskfile exposes.'
    silent: true
    cmds:
      - ls -1 /usr/local/share/go-task/includes.d/*.yml 2>/dev/null | sed -e 's#.*/##' -e 's/\.yml$//' || echo '(none)'

  registry:refresh:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Regenerate /usr/local/share/go-task/features.yml from includes.d. Normally done at image build; only needed after editing includes.d by hand (needs root).'
    cmds:
      - if [ "$(id -u)" -eq 0 ]; then task-features-registry; else sudo task-features-registry; fi

  aliases:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Regenerate the team task aliases (needs the taskAliases option): read the team aliases file, check each alias against the root Taskfile, write one wrapper task per accepted alias and print the report (ok, shadows, broken, invalid). Run it again after editing the file. Exits non-zero when any alias is not generated.'
    cmds:
      - |
        if ! command -v task-aliases >/dev/null 2>&1; then
          echo "go-task:aliases: the taskAliases option is off (set it to true on the go-task Feature and rebuild)." >&2
          exit 1
        fi
        task-aliases generate --strict

  setup:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Re-run the post-create setup: with the taskAliases option on, hand the folder of the generated aliases Taskfile to the current user and keep it owner-only (idempotent; does nothing with the option off).'
    cmds:
      - go-task-setup
