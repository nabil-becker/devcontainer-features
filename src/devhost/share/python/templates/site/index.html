<title>Court Dashboard</title>
<style>
:root{
  --bg:#ffffff;--surface:#f6f8fa;--fg:#1b1f24;--muted:#57606a;--line:#d0d7de;--accent:#0b5fd0;--code-bg:#eef1f4;
  --ok:#1a7f37;--ok-bg:#dafbe1;--warn:#7a4f00;--warn-bg:#fff1c2;--bad:#b42318;--bad-bg:#ffe3e0;--info:#0b5fd0;--info-bg:#ddf4ff;
  --mark:#ffe58a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1117;--surface:#161b22;--fg:#e6edf3;--muted:#9aa4af;--line:#30363d;--accent:#58a6ff;--code-bg:#1b222b;
  --ok:#56d364;--ok-bg:#12361f;--warn:#e3b341;--warn-bg:#3d2e05;--bad:#ff7b72;--bad-bg:#4a1a17;--info:#79c0ff;--info-bg:#10294a;
  --mark:#6b5600;
}}
:root[data-theme="dark"]{
  --bg:#0d1117;--surface:#161b22;--fg:#e6edf3;--muted:#9aa4af;--line:#30363d;--accent:#58a6ff;--code-bg:#1b222b;
  --ok:#56d364;--ok-bg:#12361f;--warn:#e3b341;--warn-bg:#3d2e05;--bad:#ff7b72;--bad-bg:#4a1a17;--info:#79c0ff;--info-bg:#10294a;
  --mark:#6b5600;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-inline:16px;background:var(--bg);color:var(--fg);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-wrap:anywhere}
#app,#top{max-width:980px;margin-inline:auto}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3,h4{line-height:1.25;margin:1.2em 0 .45em}
h1{font-size:1.5em}h2{font-size:1.25em}h3{font-size:1.08em}
p{margin:.5em 0}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em}
code{background:var(--code-bg);padding:.1em .3em;border-radius:3px}
pre{background:var(--code-bg);padding:10px;border-radius:6px;overflow-x:auto;max-width:100%}
pre code{background:none;padding:0}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;min-width:0}
th,td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.nw{white-space:nowrap}
th{background:var(--surface)}
.muted{color:var(--muted)}
.small{font-size:.86em}
mark{background:var(--mark);color:inherit;border-radius:2px}

#top{padding-top:10px}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.brand{font-weight:700;font-size:1.1em;text-decoration:none;color:var(--fg)}
.search{flex:1 1 200px;min-width:0}
.search input{width:100%;min-height:40px;padding:6px 10px;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
nav a{flex:0 0 auto;min-height:40px;display:inline-flex;align-items:center;padding:0 12px;border-radius:8px;text-decoration:none;color:var(--fg)}
nav a[aria-current="page"]{background:var(--info-bg);color:var(--info);font-weight:600}
.built{margin:6px 0 0}

.chip{display:inline-block;padding:0 8px;border-radius:10px;font-size:.78em;line-height:1.6;font-weight:600;background:var(--surface);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.id{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.82em;color:var(--muted)}

.rows{list-style:none;margin:0;padding:0}
.rows>li{border-bottom:1px solid var(--line)}
.rows a{display:block;text-decoration:none;color:var(--fg)}
.row{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;min-height:44px;text-decoration:none;color:var(--fg)}
.row:hover{background:var(--surface)}
.row .grow{flex:1 1 auto;min-width:0}
.row .t{font-weight:600}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);min-width:0}
.stat b{display:block;font-size:1.5em;line-height:1.2}
.stat.warn{border-color:var(--warn)}
details.entry{border-bottom:1px solid var(--line)}
details.entry>summary{cursor:pointer;padding:10px 4px;min-height:44px;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
details.entry>summary .t{font-weight:600;flex:1 1 200px;min-width:0}
details.entry .body{padding:0 4px 12px}
dl.fields{margin:0}
dl.fields dt{font-weight:600;margin-top:8px;color:var(--muted);font-size:.86em;text-transform:none}
dl.fields dd{margin:0}
dl.fields .friction{background:var(--warn-bg);color:var(--fg);border-left:4px solid var(--warn);padding:4px 8px;border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
button.f{min-height:36px;padding:0 12px;font:inherit;font-size:.9em;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--fg);cursor:pointer}
button.f[aria-pressed="true"]{background:var(--info-bg);color:var(--info);border-color:var(--info);font-weight:600}
input.filter{width:100%;max-width:420px;min-height:40px;padding:6px 10px;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px}
.crumbs{margin:10px 0 0;font-size:.9em}
.docbody img{max-width:100%}
.docbody blockquote{margin:.6em 0;padding:.1em 12px;border-left:4px solid var(--line);color:var(--muted)}
.toc{border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:var(--surface);margin:10px 0}
.toc summary{cursor:pointer;min-height:36px;display:flex;align-items:center}
.toc ul{margin:0 0 6px;padding-left:18px}
.toc a{display:inline-block;padding:3px 0}
.mermaid{overflow-x:auto;max-width:100%;margin:.6em 0}
.note{border:1px solid var(--warn);background:var(--warn-bg);border-radius:8px;padding:6px 10px;margin:8px 0}
.snip{margin:2px 0 0}
</style>
<!--SITE-DATA-->
<div id="top">
  <div class="bar">
    <a class="brand" id="brand" href="#home">Court</a>
    <div class="search"><input id="q" type="search" placeholder="Search every doc" aria-label="Search every doc" autocomplete="off"></div>
  </div>
  <nav id="nav" aria-label="Sections"></nav>
  <p class="built muted small" id="built"></p>
</div>
<main id="app" tabindex="-1"></main>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>

/* ---------- header ---------- */

}

  root.appendChild(el("p", null, link("All ledger entries", "ledger")));
  root.appendChild(el("h2", null, "Features"));
  root.appendChild(featuresTable());
  if (D.prs) {
    root.appendChild(el("h2", null, "Open pull requests"));
    root.appendChild(prList());

  root.appendChild(el("h2", null, "Records"));
  root.appendChild(el("p", null, link("ADRs, proposals, night shifts, journal, costs", "records"), " | ", link("All docs", "docs")));
  M.notes.forEach(function (n) { root.appendChild(el("p", { "class": "note small" }, n)); });

}

}

var LG = { text: "" };
function viewLedger(anchor) {
  var root = el("div", null, el("h2", null, "Ledger"), el("p", { "class": "muted small" }, D.ledger.entries.length + " entries, " + D.ledger.entries_since_review + " since the last review" + (D.ledger.last_review ? " (" + D.ledger.last_review + ")" : "") + ". Newest first.")),

  root.appendChild(R.proposals.length ? el("ul", { "class": "rows" }, R.proposals.map(function (p) {
    return el("li", null, link(el("span", { "class": "row" }, el("span", { "class": "grow" }, el("span", { "class": "t" }, p.title), el("div", { "class": "muted small" }, p.status)), chip((p.status || "?").split(/[\s:,.;(]/)[0], STATUS_KIND(p.status))), "d~" + tok(p.path)));
  })) : empty("None."));
