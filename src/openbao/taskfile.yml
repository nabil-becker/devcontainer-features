# Tasks contributed by the openbao Feature (namespace: openbao). BAO_ADDR must point at your
# server (set it in containerEnv); in server mode it defaults to the local server (openbao-run).
# The tasks that talk to bao go through openbao-run, which applies that default and nothing else.
version: '3'

tasks:
  version:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Show the installed bao CLI version.'
    cmds:
      - bao version

  status:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Show the server status (seal state, HA, version) at BAO_ADDR (bao status).'
    cmds:
      - openbao-run bao status {{.CLI_ARGS}}

  server:status:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Show the mode, the address, the server''s state (unsealed, sealed, not initialised, unreachable), and in server mode the process, the storage, the audit log, the backup choice (a standing warning when there is none) and whether the login is valid. Exit 0 unsealed, 10 unreachable, 11 sealed or not initialised.'
    cmds:
      - openbao-server status

  init:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Server mode, once, the Operator only, in a plain terminal (refuses inside an agent''s job and without a terminal): ask for a backup destination or an explicit "no backup" and for the Operator''s password, initialise the server (3 unseal shares, threshold 2, printed once to the terminal), unseal it with two of them, enable the dcf KV mount, userpass (login 4 hours, at most 8) and approle, write the Operator''s policy, record the backup choice, revoke the root token. -pgp-keys=... after -- encrypts the shares.'
    interactive: true
    cmds:
      - openbao-server init {{.CLI_ARGS}}

  unseal:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Server mode, the Operator only, in a plain terminal (refuses inside an agent''s job and without a terminal): enter unseal shares at bao''s own hidden prompt until the server is unsealed. Needed after every server start.'
    interactive: true
    cmds:
      - openbao-server unseal

  seal:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Server mode: seal the server with the saved login (refuses inside an agent''s job). Everything that reads a secret then fails with exit 11 until task openbao:unseal.'
    cmds:
      - openbao-server seal

  approle:issue:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Server mode: ROLE=<name> POLICY_PATH=<mount/path> makes (or updates) an AppRole role that may read that one secret (this step asks for two unseal shares at a hidden prompt, to make a root token used for it alone and revoked after; the Operator only, in a plain terminal, refused inside an agent''s job), bound to the container''s loopback, with 5 minute tokens (at most 15) and secret ids that do not expire; ROLE=<name> alone reissues an existing role; ALL=1 reissues every role in the store (both with your login, no shares). Each role ends with exactly one valid secret id, written with its role id under the state dir (mode 600, never printed).'
    env:
      OPENBAO_TASK_ROLE: '{{.ROLE | default ""}}'
      OPENBAO_TASK_POLICY_PATH: '{{.POLICY_PATH | default ""}}'
      OPENBAO_TASK_ALL: '{{.ALL | default ""}}'
    cmds:
      - openbao-server approle-issue

  approle:revoke:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Server mode: ROLE=<name> deletes the role, which destroys its secret ids, with its policy and its files under the state dir. Asks for two unseal shares at a hidden prompt (a root token for this step alone, revoked after): the Operator only, in a plain terminal, refused inside an agent''s job. A token it already made lives at most 15 minutes.'
    requires:
      vars: [ROLE]
    env:
      OPENBAO_TASK_ROLE: '{{.ROLE}}'
    cmds:
      - openbao-server approle-revoke

  onboard:export:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Onboarding, the sender, in a plain terminal (refuses inside an agent''s job and without a terminal): NAMES=<name>,... DEST=<folder>. Starts a short-lived second server in this container, copies the named secrets (every field, from your own store, with your login) into it, writes the onboarding marker, takes a raft snapshot into DEST as onboarding-<machine>-<UTC time>.snap (mode 600, never overwritten), stops the instance and deletes its folder. Prints once, to the terminal, the instance''s fresh unseal shares (3, threshold 2) and the claim token: hand them over separately from the file. The receiver runs openbao:restore, then openbao:onboard:claim. Never your own store''s shares.'
    interactive: true
    requires:
      vars: [NAMES, DEST]
    env:
      OPENBAO_TASK_NAMES: '{{.NAMES}}'
      OPENBAO_TASK_DEST: '{{.DEST}}'
    cmds:
      - openbao-onboard export

  onboard:claim:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Onboarding, the receiver, server mode, after openbao:restore of an onboarding snapshot, in a plain terminal (refuses inside an agent''s job and without a terminal): asks for the claim token, your own Operator password and two of the sender''s shares, runs bao operator rotate-keys (new unseal shares, printed once, committed only after you type two back), revokes everything the sender held (every token, every user, every auth method but token, userpass and approle, any other audit device, the AppRole roles written again so every secret id is gone), sets up your Operator, reissues the AppRole secret ids (openbao:approle:issue ALL=1), rotates the data key (ROTATE=0 skips it), replaces the onboarding marker, revokes the claim token, and lists the names that came with the snapshot as the sender''s knowledge. Safe to run again after a failure (it resumes after the rotation).'
    interactive: true
    env:
      OPENBAO_TASK_ROTATE: '{{.ROTATE | default ""}}'
    cmds:
      - openbao-onboard claim

  wrap:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Response wrapping, the sender, against a central server in client mode (refuses inside an agent''s job): NAMES=<name>,... [TTL=15m] [OUT=<file>] [SHOW=1]. One one-use wrapping token per secret (bao kv get -wrap-ttl), TTL default 15 minutes and capped at 1 hour. The tokens go to a file (mode 600, on tmpfs, default /dev/shm), whose path and expiry are printed; SHOW=1 also prints them, to a terminal only. The receiver runs openbao:unwrap.'
    requires:
      vars: [NAMES]
    env:
      OPENBAO_TASK_NAMES: '{{.NAMES}}'
      OPENBAO_TASK_TTL: '{{.TTL | default ""}}'
      OPENBAO_TASK_OUT: '{{.OUT | default ""}}'
      OPENBAO_TASK_SHOW: '{{.SHOW | default ""}}'
    cmds:
      - openbao-onboard wrap

  unwrap:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Response wrapping, the receiver (refuses inside an agent''s job): FROM=<file of "<name> <token>" lines> [ISSUER_ADDR=<the server that made them, default BAO_ADDR>], or with no FROM the name and the token at prompts (the token is never an argument and not echoed). Looks every token up first (sys/wrapping/lookup) and refuses, unwrapping nothing, unless each was made by a read of its own secret''s path and has not run out; then unwraps each once and puts it with dcf-secret put into your own store (BAO_ADDR).'
    interactive: true
    env:
      OPENBAO_TASK_FROM: '{{.FROM | default ""}}'
      OPENBAO_TASK_ISSUER_ADDR: '{{.ISSUER_ADDR | default ""}}'
    cmds:
      - openbao-onboard unwrap

  login:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Log in to BAO_ADDR. Auth method and flags after --, e.g. task openbao:login -- -method=oidc; against the server this Feature runs: task openbao:login -- -method=userpass username=operator'
    interactive: true
    cmds:
      - openbao-run bao login {{.CLI_ARGS}}

  logout:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Log out: revoke the current token on the server (bao token revoke -self; ignored if it is already dead) and erase the saved token in the state dir, so nothing is left behind. bao token revoke alone leaves the dead token stored.'
    cmds:
      - openbao-run bao token revoke -self || true
      - openbao-token-helper erase

  kv:get:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Read secret KEY=<mount/path> from a KV engine (KEY, not PATH: Task would read the shell PATH).'
    requires:
      vars: [KEY]
    cmds:
      - openbao-run bao kv get {{.CLI_ARGS}} '{{.KEY}}'

  backup:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Server mode (client mode: with a role or token the server''s owner provides): write a raft snapshot to DEST=<folder> (else the backupDest option, else the folder recorded at init) as openbao-<machine>-<UTC time>.snap, never over a file that exists, from a private tmpfs folder that is removed on every way out; then keep only the newest KEEP=<n> (else backupKeep, default 30; 0 keeps all) of this machine''s own files there. Logs in with the backup role (a server made before 1.3.0: your login). Non-interactive, so a scheduler can run it. Prints the path and sha256. Exit 0 written, 10 unreachable, 11 sealed or not initialised, 12 cannot log in, 13 the snapshot read is denied, 20 DEST missing or not writable, 2 no destination. The unseal shares never go with a backup.'
    env:
      OPENBAO_TASK_DEST: '{{.DEST | default ""}}'
      OPENBAO_TASK_KEEP: '{{.KEEP | default ""}}'
    cmds:
      - openbao-server backup

  backup:role:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Server mode, the Operator only, in a plain terminal (refuses inside an agent''s job and without a terminal): make the backup role (read on the snapshot path only, loopback only) on a server initialised before 1.3.0, from a root token generated from two unseal shares, used once and revoked.'
    interactive: true
    cmds:
      - openbao-server backup-role

  restore:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Server mode, the Operator only, in a plain terminal (refuses inside an agent''s job and without a terminal): install the snapshot FROM=<file> written by task openbao:backup. On an empty server it first initialises with one throwaway share (discarded); on a store in use it replaces it after you type restore and a root token generated from two of its shares (used once, revoked). The restored store is sealed under the snapshot''s own shares: enter two of them, then every AppRole gets a new secret id. Safe to run twice; a half-done restore starts again from empty. Warns when the file is from another machine.'
    interactive: true
    requires:
      vars: [FROM]
    env:
      OPENBAO_TASK_FROM: '{{.FROM}}'
    cmds:
      - openbao-server restore

  setup:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Re-run the post-create setup: make OPENBAO_STATE_DIR usable by the current user, move a token left in ~/.vault-token into it, report the token helper, the address and whether a login is saved; in server mode also run the start hook (write the server config, start the server if it is not running, say whether it is sealed). Idempotent; OPENBAO_SETUP_MODE overrides the Feature option.'
    cmds:
      - openbao-setup
      - openbao-setup start
