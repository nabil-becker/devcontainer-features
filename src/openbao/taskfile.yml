# Tasks contributed by the openbao Feature (namespace: openbao). BAO_ADDR
# must point at your server (set it in containerEnv).
version: '3'

tasks:
  version:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Show the installed bao CLI version.'
    cmds:
      - bao version

  status:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Show the server status (seal state, HA, version) at BAO_ADDR.'
    cmds:
      - bao status {{.CLI_ARGS}}

  login:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Log in to BAO_ADDR. Auth method and flags after --, e.g. task openbao:login -- -method=oidc'
    interactive: true
    cmds:
      - bao login {{.CLI_ARGS}}

  logout:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Log out: revoke the current token on the server (bao token revoke -self; ignored if it is already dead) and erase the saved token in the state dir, so nothing is left behind. bao token revoke alone leaves the dead token stored.'
    cmds:
      - bao token revoke -self || true
      - openbao-token-helper erase

  kv:get:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Read secret KEY=<mount/path> from a KV engine (KEY, not PATH: Task would read the shell PATH).'
    requires:
      vars: [KEY]
    cmds:
      - bao kv get {{.CLI_ARGS}} '{{.KEY}}'

  setup:
    dir: '{{.USER_WORKING_DIR}}'
    desc: 'Re-run the post-create setup: make OPENBAO_STATE_DIR usable by the current user, move a token left in ~/.vault-token into it, report the token helper, the address and whether a login is saved (idempotent; OPENBAO_SETUP_MODE overrides the Feature option).'
    cmds:
      - openbao-setup
