# Reusable devcontainer:* tasks - drive @devcontainers/cli against the
# including repo's .devcontainer without installing Node.js or the CLI on the
# host. Vendored into a repo (together with ./host/*) by
#   irm  https://raw.githubusercontent.com/nabil-becker/devcontainer-features/main/bootstrap/bootstrap.ps1 | iex   (Windows)
#   curl -fsSL https://raw.githubusercontent.com/nabil-becker/devcontainer-features/main/bootstrap/bootstrap.sh | bash  (Linux/macOS)
# and included from the repo's Taskfile.yml as
#   includes:
#     devcontainer:
#       taskfile: ./bootstrap/devcontainer.yml
# It cannot be a *remote* include: the tasks run the scripts next to this
# file and Task leaves TASKFILE_DIR empty for remote Taskfiles. Re-run the
# bootstrap to refresh the vendored copy.
#
# Platforms: Windows runs host/Invoke-DevcontainerCli.ps1 (pwsh, portable
# Node.js cached in %LOCALAPPDATA%); Linux/macOS run devcontainer-cli.sh
# (`devcontainer` on PATH, else a portable Node.js cached in ~/.cache). That
# bash script is the devcontainer-cli Feature's own installer: in a
# consuming repo it is vendored to host/devcontainer-cli.sh, in the
# collection repo it stays at src/devcontainer-cli/devcontainer-cli.sh -
# _BASH_CLI below finds whichever exists. Same behaviour and settings on
# both platforms.
#
# Settings - each is a Task var that falls back to the environment variable
# of the same name, so a .env file (root Taskfile `dotenv:`) or a plain
# exported variable configures them:
#   DEVCONTAINER_DOCKER_PATH   docker-compatible CLI for --docker-path: a name
#                              on PATH (docker, wslc, podman, nerdctl, finch)
#                              or a full path. Unset = docker on PATH, else
#                              wslc.exe on Windows.
#   DEVCONTAINER_NODE_VERSION  portable Node.js version (default in the scripts).
#   DEVCONTAINER_CLI_VERSION   @devcontainers/cli version (default: latest).
#   WORKSPACE_FOLDER           folder containing .devcontainer/ (default: the
#                              root Taskfile's folder).
version: '3'

vars:
  WORKSPACE_FOLDER: '{{.WORKSPACE_FOLDER | default .ROOT_DIR}}'
  DEVCONTAINER_DOCKER_PATH: '{{.DEVCONTAINER_DOCKER_PATH | default ""}}'
  DEVCONTAINER_NODE_VERSION: '{{.DEVCONTAINER_NODE_VERSION | default ""}}'
  DEVCONTAINER_CLI_VERSION: '{{.DEVCONTAINER_CLI_VERSION | default ""}}'
  _PS_SETTINGS: -DockerPath '{{.DEVCONTAINER_DOCKER_PATH}}' -NodeVersion '{{.DEVCONTAINER_NODE_VERSION}}' -CliVersion '{{.DEVCONTAINER_CLI_VERSION}}'
  _BASH_CLI:
    sh: 'f="{{.TASKFILE_DIR}}/host/devcontainer-cli.sh"; if [ -f "$f" ]; then echo "$f"; else echo "{{.TASKFILE_DIR}}/../src/devcontainer-cli/devcontainer-cli.sh"; fi'

env:
  # The bash flavour reads these from the environment; export the resolved
  # values so .env / CLI vars reach it too.
  DEVCONTAINER_DOCKER_PATH: '{{.DEVCONTAINER_DOCKER_PATH}}'
  DEVCONTAINER_NODE_VERSION: '{{.DEVCONTAINER_NODE_VERSION}}'
  DEVCONTAINER_CLI_VERSION: '{{.DEVCONTAINER_CLI_VERSION}}'

tasks:
  cli:
    desc: 'Internal: run one @devcontainers/cli subcommand. vars: SUBCOMMAND, ARGS (string, shell-split), CMD (exec only, base64-encoded on the way through).'
    internal: true
    interactive: true
    requires:
      vars: [SUBCOMMAND]
    vars:
      ARGS: '{{.ARGS | default ""}}'
      CMD: '{{.CMD | default ""}}'
    cmds:
      - cmd: pwsh -NoLogo -NoProfile -File '{{.TASKFILE_DIR}}/host/Invoke-DevcontainerCli.ps1' -WorkspaceFolder '{{.WORKSPACE_FOLDER}}' {{._PS_SETTINGS}} -Subcommand '{{.SUBCOMMAND}}' -CliArgsB64 '{{.ARGS | splitArgs | toJson | b64enc}}' {{if .CMD}}-CommandB64 '{{.CMD | b64enc}}'{{end}}
        platforms: [windows]
      - cmd: bash '{{._BASH_CLI}}' run '{{.SUBCOMMAND}}' --workspace-folder '{{.WORKSPACE_FOLDER}}' {{if .CMD}}--cmd-b64 '{{.CMD | b64enc}}'{{end}} -- {{.ARGS}}
        platforms: [linux, darwin]

  init:
    desc: 'Prepare the host side once: cache the portable Node.js + @devcontainers/cli (Windows: %LOCALAPPDATA%\devcontainer-features; Linux/macOS: ~/.cache/devcontainer-features, skipped when `devcontainer` is already on PATH) and report the container engine. Nothing is installed globally. FORCE=true reinstalls the cached CLI.'
    vars:
      FORCE: '{{.FORCE | default "false"}}'
    cmds:
      - cmd: pwsh -NoLogo -NoProfile -File '{{.TASKFILE_DIR}}/host/Initialize-DevcontainerCli.ps1' {{._PS_SETTINGS}} {{if eq .FORCE "true"}}-Force{{end}}
        platforms: [windows]
      - cmd: bash '{{._BASH_CLI}}' init {{if eq .FORCE "true"}}--force{{end}}
        platforms: [linux, darwin]

  up:
    desc: 'Build (if needed) and start the devcontainer for {{.WORKSPACE_FOLDER}}. Idempotent. Extra `devcontainer up` flags after --, e.g. task devcontainer:up -- --remove-existing-container.'
    cmds:
      - task: cli
        vars:
          SUBCOMMAND: up
          ARGS: '{{.CLI_ARGS}}'

  rebuild:
    desc: 'Recreate the devcontainer from scratch (devcontainer up --remove-existing-container --build-no-cache). VS Code windows attached to the old container must reload.'
    cmds:
      - task: cli
        vars:
          SUBCOMMAND: up
          ARGS: '--remove-existing-container --build-no-cache'

  build:
    desc: 'Build the devcontainer image without starting a container (validates devcontainer.json and every Feature install).'
    cmds:
      - task: cli
        vars:
          SUBCOMMAND: build
          ARGS: '{{.CLI_ARGS}}'

  exec:
    desc: 'Run CMD="<command>" inside the running devcontainer via bash -lc, as the configured remoteUser. CMD is base64-encoded on the way through, so nested quotes/newlines need no escaping.'
    requires:
      vars: [CMD]
    cmds:
      - task: cli
        vars:
          SUBCOMMAND: exec
          CMD: '{{.CMD}}'

  shell:
    desc: 'Open an interactive login shell inside the running devcontainer.'
    interactive: true
    cmds:
      - task: cli
        vars:
          SUBCOMMAND: exec
          ARGS: 'bash -l'

  config:
    desc: 'Print the fully resolved devcontainer configuration (devcontainer read-configuration --include-merged-configuration).'
    cmds:
      - task: cli
        vars:
          SUBCOMMAND: read-configuration
          ARGS: '--include-merged-configuration'

  reset-storage:
    desc: 'wslc.exe only: reset WSL Containers'' backing storage after a "read-only file system" BuildKit error. Destroys ALL wslc images and containers. Windows-only.'
    platforms: [windows]
    cmds:
      - pwsh -NoLogo -NoProfile -File '{{.TASKFILE_DIR}}/host/Reset-WslcStorage.ps1'

  '*':
    desc: 'Passthrough: the part after "devcontainer:" becomes the @devcontainers/cli subcommand, args after --. e.g. task devcontainer:outdated, task devcontainer:features -- test -f go-task.'
    cmds:
      - task: cli
        vars:
          SUBCOMMAND: '{{index .MATCH 0}}'
          ARGS: '{{.CLI_ARGS}}'
