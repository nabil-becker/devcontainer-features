version: '3'

# devcontainer:* tasks come from taskfiles/devcontainer.yml, vendored by
# bootstrap.ps1 / bootstrap.sh from github.com/nabil-becker/devcontainer-features.
# Re-run the bootstrap to refresh it. Settings (DEVCONTAINER_DOCKER_PATH, ...)
# can live in .devcontainer/.env - see .devcontainer/.env.example.
dotenv: ['.env', '.devcontainer/.env']

includes:
  devcontainer:
    taskfile: ./taskfiles/devcontainer.yml
  # Tasks contributed by the Features installed in the devcontainer (dsc:*,
  # velero:*, ...). The file only exists inside the container; on the host it
  # is skipped. See the go-task Feature README.
  features:
    taskfile: /usr/local/share/go-task/features.yml
    optional: true
    flatten: true

tasks:
  default:
    silent: true
    cmds:
      - task --list
