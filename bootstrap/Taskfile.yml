version: '3'

# devcontainer:* tasks come from {{BOOTSTRAP_DIR}}/devcontainer.yml, vendored by
# bootstrap.ps1 / bootstrap.sh from github.com/nabil-becker/devcontainer-features.
# That folder is git-ignored (so it is not committed): on a fresh clone run the
# bootstrap one-liner first (see the README, "Bootstrap a repo"); until then the
# include below is skipped (optional: true) and only the other tasks exist.
# Re-run the bootstrap to refresh it. Settings (DEVCONTAINER_DOCKER_PATH, ...)
# can live in .devcontainer/.env - see .devcontainer/.env.example.
dotenv: ['.env', '.devcontainer/.env']

includes:
  devcontainer:
    taskfile: './{{BOOTSTRAP_DIR}}/devcontainer.yml'
    optional: true
    aliases: [dc]   # task dc:up == task devcontainer:up
  # task cloud-folder:login on the workstation (the launcher signs the cloud-folder Feature in
  # through the running devcontainer). Left out inside the container, where the cloud-folder
  # Feature's own cloud-folder:login comes from features.yml: its containerEnv sets RCLONE_CONFIG
  # to this path. See {{BOOTSTRAP_DIR}}/cloud-folder.yml.
  cloud-folder:
    taskfile: '{{if or (eq (.RCLONE_CONFIG | default "") "/var/lib/devcontainer-features/cloud-folder/rclone.conf") (eq (.DEVCONTAINER_IN_CONTAINER | default "") "1")}}./{{BOOTSTRAP_DIR}}/none.yml{{else}}./{{BOOTSTRAP_DIR}}/cloud-folder.yml{{end}}'
    optional: true
  # Tasks contributed by the Features installed in the devcontainer (dsc:*,
  # velero:*, ...). The file only exists inside the container; on the host it
  # is skipped. See the go-task Feature README.
  features:
    taskfile: /usr/local/share/go-task/features.yml
    optional: true
    flatten: true

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # The shutdown check devcontainer:stop, :rebuild and :prepshutdown run inside
  # the container (contract: bootstrap/SHUTDOWN.md in the devcontainer-features
  # collection). Without this task they use devhost-shutdown-check if it exists,
  # else stop without a check.
  shutdown:check:
    desc: 'Shutdown check: refuse a stop while a git operation is in progress or a stash is left behind (report uncommitted and unpushed work). Run by devcontainer:stop and :rebuild inside the container; edit .devcontainer/shutdown-check.sh to add this repository''s own checks.'
    cmds:
      - sh .devcontainer/shutdown-check.sh
