# The agents of this repository (claude-code participants: true): task agents -- <name> inside,
# task devcontainer:agent -- <name> from the workstation (no name: the default, host);
# task agents:list shows them.
agents:
  # The host session, driven from the workstation and from the phone. On-demand with
  # --remote-control until a background session is shown to be reachable through Remote
  # Control (the agents proposal, decision D2 and fact 5); then it becomes resident.
  - name: host
    cli: claude
    kind: on-demand
    folder: .
    args: [--remote-control]
    default: true          # task dc:agent with no name starts it
  # The one agent the workstation mesh may reach (cross-node-approval, gate B, 2026-11-25): Claude Code in
  # its default permission mode, so it asks a person before every tool it runs on a request from another
  # node. The host session (auto mode) stays local: mesh.template.yml exposes only this agent. Gate A,
  # the facilitator holding each cross-node message for a person (approval: every-message), comes with
  # facilitator 0.9.0.
  - name: mesh
    cli: claude
    kind: on-demand
    folder: .
    args: [--permission-mode, default]
